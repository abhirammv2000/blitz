name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    env:
      # The suite never calls a provider, but the modules under test read these
      # at import. Dummy values keep a stray real call failing on auth rather
      # than spending money against a live key.
      OPENAI_API_KEY: test-dummy-openai
      GEMINI_API_KEY: test-dummy-gemini
      TAVILY_API_KEY: test-dummy-tavily
      FIRECRAWL_API_KEY: test-dummy-firecrawl
      # Without this litellm downloads its cost map from GitHub on import, which
      # makes the suite depend on network access it should not need.
      LITELLM_LOCAL_MODEL_COST_MAP: "True"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" || pip install . pytest pytest-asyncio ruff

      - name: Lint
        run: ruff check app tests

      - name: Test
        run: pytest tests -q

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      # tsc runs as part of the build. This is the check that would have caught
      # the four type errors that made the production build fail while the dev
      # server carried on working.
      - run: npm run build
