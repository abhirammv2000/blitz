[project]
name = "blitz-backend"
version = "0.1.0"
description = "Blitz — AI-powered marketing pipeline backend"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2.0",
    "langgraph-checkpoint-sqlite>=1.0.0",
    "litellm>=1.40.0",
    "chromadb>=0.5.0",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "python-dotenv>=1.0.0",
    "sse-starlette>=2.1.0",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "aiosqlite>=0.22.1",
    "tavily-python>=0.7.21",
    "firecrawl-py>=4.16.0",
    "pydantic-settings>=2.0.0",
]

# Declared as an extra rather than a PEP 735 dependency-group: `pip install
# -e ".[dev]"` works on every pip, while --group needs pip 25.1+. uv reads this
# too, via `uv sync --extra dev`. One list, so the two cannot drift.
[project.optional-dependencies]
dev = [
    "ruff>=0.4.0",
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
# Tests must never call a real LLM API. They run offline, for free, in seconds —
# a suite that costs money per run is a suite nobody runs.
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = []

[tool.ruff.lint.per-file-ignores]
# Prompt templates are prose written for a language model. Hard-wrapping them to
# satisfy a line limit would hurt the thing that actually matters — how they read
# to the model and to whoever edits them next.
"app/agents/*/prompts.py" = ["E501"]
"app/agents/agent_5_ads/critic.py" = ["E501"]
"app/agents/agent_voice/elevenlabs_client.py" = ["E501"]
"app/agents/agent_0_research/research.py" = ["E501"]
"app/agents/agent_5_ads/node.py" = ["E501"]

# The manual smoke scripts intentionally adjust sys.path before importing, so
# their imports cannot sit at the top of the file. They are debugging aids that
# make live API calls, not part of the automated suite.
"app/agents/*/test_agent*.py" = ["E402", "F401", "E501"]

# conftest must set LITELLM_LOCAL_MODEL_COST_MAP before anything imports litellm,
# which means one assignment above the imports.
"tests/conftest.py" = ["E402"]
# The pipeline test imports fixture payloads from a sibling test module after
# defining local helpers, which reads better than hoisting it.
"tests/test_pipeline.py" = ["E402"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
